plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after Android and Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) flutterVersionCode = "1"

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) flutterVersionName = "1.0"

// First green build: stock debug signing only. The full signing setup is in
// backup/config_full/build.gradle and can be restored after baseline is green.

android {
    // Matches: flutter create --org com.arifa.app --project-name arifa
    namespace = "com.arifa.app.arifa"
    compileSdk = 34
    ndkVersion = "23.1.7779620"

    compileOptions {
        // Java 17 is the JDK used by CI; bytecode stays compatible with the
        // Flutter 3.24 / AGP 7.3 toolchain.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.arifa.app.arifa"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        // Debug is the only CI target for the first green build.
        release {
            // uses the default Android debug key; restored later from backup.
        }
    }
}

flutter {
    source = "../.."
}
