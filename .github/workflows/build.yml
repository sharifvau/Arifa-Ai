name: Build ARIFA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.47.9 bundles Dart 3.13.7, which satisfies this project and
      # all pinned dependencies (some require Dart >=3.10 / >=3.12).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # This repo stores only ARIFA's custom Android files. bootstrap.sh
      # generates the standard Gradle scaffold, then restores our sources.
      - name: Generate Android platform files
        run: bash scripts/bootstrap.sh

      - name: Regenerate ARIFA launcher icons
        run: python3 scripts/generate_icon.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arifa-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
