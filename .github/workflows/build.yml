name: Build ARIFA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.24.0 ships Dart 3.5.0. pubspec.yaml, the pinned plugins and
      # the tracked Gradle files all match exactly this SDK.
      - name: Set up Flutter 3.24.0 stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          java -version
          git --version

      # This repo stores only ARIFA's custom Android files plus the pinned
      # Gradle config. bootstrap.sh generates the rest of the platform scaffold.
      - name: Generate Android platform files
        run: bash scripts/bootstrap.sh

      - name: Regenerate ARIFA launcher icons
        run: python3 scripts/generate_icon.py

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get (verbose)
        run: flutter pub get --verbose

      # Analyzer failures are real build failures now. All Dart errors and
      # warnings are fixed, and the complete output stays in the Actions log.
      - name: Flutter analyze
        run: flutter analyze

      - name: Build APK (release, fallback to debug)
        id: apk
        shell: bash
        run: |
          echo "=========================================================="
          echo "RELEASE BUILD - full output below"
          echo "=========================================================="
          release_status=0
          flutter build apk --release --verbose || release_status=$?
          echo "RELEASE BUILD EXIT CODE: $release_status"

          if [ "$release_status" -eq 0 ]; then
            echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "Release APK built successfully."
            exit 0
          fi

          echo "::warning::Release build failed (exit $release_status). Trying debug APK."

          flutter clean

          echo "=========================================================="
          echo "RE-DOWNLOAD DEPENDENCIES - full output below"
          echo "=========================================================="
          pub_status=0
          flutter pub get --verbose || pub_status=$?
          echo "PUB GET EXIT CODE: $pub_status"

          echo "=========================================================="
          echo "DEBUG BUILD - full output below"
          echo "=========================================================="
          debug_status=0
          flutter build apk --debug --verbose || debug_status=$?
          echo "DEBUG BUILD EXIT CODE: $debug_status"

          if [ "$debug_status" -ne 0 ]; then
            echo "==========================================================" >&2
            echo "BUILD FAILED - release AND debug both failed." >&2
            echo "Release exit: $release_status | pub get exit: $pub_status | debug exit: $debug_status" >&2
            echo "Read the complete error log above (nothing was suppressed)." >&2
            echo "==========================================================" >&2
            echo "::error::ARIFA APK build FAILED. Release exit=$release_status, pub get exit=$pub_status, debug exit=$debug_status. Full unfiltered log is printed above."
            exit "$debug_status"
          fi

          echo "apk_path=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Debug APK built successfully (release build was not available)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arifa-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
