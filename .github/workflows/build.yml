name: Build ARIFA Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.0 stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Run flutter --version
        run: flutter --version

      - name: Complete Android scaffold when needed
        shell: bash
        run: |
          if [ -f pubspec.yaml ] && { \
            [ ! -d android ] || \
            [ ! -f android/gradlew ] || \
            [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || \
            [ ! -f android/build.gradle ] || \
            [ ! -f android/settings.gradle ] || \
            [ ! -f android/app/build.gradle ] || \
            [ ! -f android/app/src/main/AndroidManifest.xml ]; }; then
            flutter create --org com.arifa.app --project-name arifa --platforms android .
            git checkout HEAD -- lib/ assets/ models.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK with full verbose log
        id: debug_build
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee flutter-build-debug.log

      - name: Fail clearly with the full debug log
        if: ${{ failure() && steps.debug_build.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::DEBUG APK BUILD FAILED. Full unfiltered log below:"
          cat flutter-build-debug.log
          echo "::error::ARIFA debug APK build failed — see the complete log above."
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arifa-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
