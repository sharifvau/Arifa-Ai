name: arifa
description: "ARIFA - a cute, friendly Bangladeshi AI assistant for Emon Bhai."
publish_to: none
version: 1.0.0+1

# FIRST GREEN BUILD — minimal dependency set only.
# The full dependency set is preserved in backup/config_full/pubspec.yaml.
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: 8.1.0
  http: 1.2.2
  shared_preferences: 2.2.3
  speech_to_text: 7.0.0
  flutter_tts: 4.2.0
  permission_handler: 11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - models.json
