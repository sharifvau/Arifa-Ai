name: arifa
description: "ARIFA - a cute, friendly Bangladeshi AI assistant for Emon Bhai."
publish_to: "none"
version: 1.0.0+1

# Pinned for Flutter 3.24.0 stable (Dart 3.5.0).
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core — exact pins keep CI reproducible on Flutter 3.24.0.
  http: 1.6.0
  archive: 4.7.1
  path_provider: 2.1.5
  share_plus: 12.0.2
  cross_file: 0.3.4+2
  file_picker: 11.0.3

  # Encrypted on-device settings. No key is stored in source code or assets.
  flutter_secure_storage: 10.3.4

  # Voice
  flutter_tts: 4.2.5
  speech_to_text: 7.4.0

  # Background + notifications
  flutter_local_notifications: 19.5.0
  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    # Editable seed only. The live list is saved in secure storage.
    - models.json
